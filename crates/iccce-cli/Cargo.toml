# iccce-cli — the scriptable shell.
#
# Exists from Pass 0 (ARCHITECTURE.md §1): it is the surface that makes
# the library verifiable without a GUI, and the surface the differential
# oracle drives. Output is designed to be diffed by a script.

[package]
name = "iccce-cli"
description = "Scriptable CLI for iccce: inspect profiles, run conversions, emit diffable numbers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# --- crates.io publication metadata (ARCHITECTURE.md DL-009) ---
# See crates/iccce-color/Cargo.toml for why `readme` and `license-file`
# point at the workspace root rather than at per-crate copies.
#
# ★ EXPECTED WARNING — do NOT silence it by deleting `license-file`.
# Cargo prints "only one of `license` or `license-file` is necessary" on
# every build because both are set, and both are set on purpose:
# `license = "MIT"` is the SPDX label crates.io indexes, `license-file`
# is what actually puts the licence TEXT into the .crate tarball.
# Delete it and the published crate ships no notice — which is the one
# thing the MIT licence itself requires. The deletion is silent: the
# build gets quieter and the tarball gets wrong.
#
# This warning has already lured one engineer (2026-08-12, caught only
# by the longer note in iccce-color). Verify after ANY change here with
# `cargo package --list -p <crate>`, which must still list `LICENSE`.
readme = "../../README.md"
license-file = "../../LICENSE"
homepage = "https://github.com/KenM76/iccce"
documentation = "https://docs.rs/iccce-cli"
# Slugs verified against https://crates.io/api/v1/category_slugs,
# 2026-08-12.
categories = ["command-line-utilities", "graphics", "multimedia::images"]
keywords = ["icc", "color", "colour", "profile", "cli"]
# Integration tests read fixtures from the repository root, which a
# .crate cannot carry; shipping them would publish tests that fail.
exclude = ["tests/"]

[[bin]]
name = "iccce"
path = "src/main.rs"

[dependencies]
# ★ THE `version` FIELDS ARE NOT OPTIONAL, and their absence made this
# crate UNPUBLISHABLE until 2026-08-17.
#
# A `path` dependency without a `version` works perfectly for a local
# build, so nothing ever complained — but `cargo package` refuses it:
#
#     all dependencies must have a version requirement specified when
#     packaging. dependency `iccce-cmm` does not specify a version
#
# Found by RUNNING `cargo package` on all five crates rather than
# trusting the handoff's claim that "publication metadata is ready". Four
# packaged; this one could not, and the publish-order note in
# `iccce-cmm/Cargo.toml` described a path — color/profile → cmm → cli —
# whose last step did not exist.
#
# ★ The version literals these lines used to carry were hoisted into the
# root `[workspace.dependencies]` on 2026-08-25, after the 0.1.0 → 0.2.0
# bump proved that "must move with it in the same commit" is a warning
# and not a mechanism. See the comment above that table.
iccce-color.workspace = true
iccce-profile.workspace = true
iccce-cmm.workspace = true
# No argument-parsing dependency yet: one subcommand does not justify
# one. When the surface grows, the candidate is clap (MIT OR Apache-2.0,
# permissive — classified per docs/LEGAL.md §1) and adding it is a
# recorded decision.

[lints]
workspace = true
