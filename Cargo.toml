# icccer — workspace manifest
#
# Five crates, per docs/ARCHITECTURE.md §1:
#
#   icccer-color    CIE colorimetry. INVARIANT: depends on nothing.
#   icccer-profile  ICC profile parsing. INVARIANT: no colour maths.
#   icccer-cmm      transforms — where profile and color meet, and where
#                  every approximation lives.
#   icccer-cli      the scriptable shell that makes the library verifiable
#                  without a GUI.
#   icccer-measure  CGATS/IT8.7 measurement files. INVARIANT: no ICC AND
#                  no colour maths — it reads numbers off a target, it
#                  does not interpret them. Pass 10 pre-work, added
#                  2026-08-12: the half of a profiler that needs no
#                  measurement hardware, buildable while the half that
#                  does waits.
#
# The invariants above are the architecture. Each is a statement about
# what a crate must NOT reach for, and each is checked by the fact that
# the crate's [dependencies] section stays empty — three of the five
# depend on nothing at all. A dependency added to icccer-color or
# icccer-measure is an architectural change, not a convenience.
#
# tools/difftest (the lcms2 differential oracle) is deliberately NOT a
# workspace member: lcms2 is an oracle, never a dependency, and keeping
# the harness out of the workspace guarantees the shipping crates cannot
# accidentally link it.

[workspace]
resolver = "2"
members = [
    "crates/icccer-color",
    "crates/icccer-profile",
    "crates/icccer-cmm",
    "crates/icccer-cli",
    "crates/icccer-measure",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/KenM76/iccce"
authors = ["Ken Mantle"]

# ------------------------------------------------------------------------
# ★ THE ONE PLACE THE VERSION NUMBER IS DUPLICATED, and it is duplicated
# because Cargo cannot do otherwise.
#
# `workspace.package.version` above is inherited by each member through
# `version.workspace = true`. It CANNOT be inherited into a *dependency
# requirement* — `{ path = ..., version = ... }` takes a literal. And the
# literal is not optional: a path dependency with no version builds
# locally but makes the crate UNPUBLISHABLE, because `cargo package`
# rejects it. That was found on 2026-08-17 by running `cargo package` on
# all five crates rather than trusting a claim that the metadata was
# ready; `icccer-cli` could not be packaged at all.
#
# Before 2026-08-25 these literals lived in the member manifests, FIVE
# copies of the version number, with a comment in two of them warning
# that they "must move with it in the same commit". The 0.1.0 → 0.2.0
# bump proved the warning insufficient: the workspace version moved, the
# five literals did not, and `cargo build` failed with a message about a
# missing crate rather than about a stale version pin.
#
# Hoisting them here does not remove the duplication — Cargo will not
# allow that — but it takes it from five sites to ONE, and puts that one
# three lines below the number it must match. When bumping the version,
# BOTH numbers in this file change, and nothing outside this file does.
# ------------------------------------------------------------------------
[workspace.dependencies]
icccer-color = { path = "crates/icccer-color", version = "0.4.0" }
icccer-profile = { path = "crates/icccer-profile", version = "0.4.0" }
icccer-cmm = { path = "crates/icccer-cmm", version = "0.4.0" }

[workspace.lints.rust]
# ARCHITECTURE.md §3.4: no `unsafe` without a written justification and a
# named rejected alternative. Deny at the workspace level; a justified
# exception carries an explicit, commented `#[allow]` at the site.
unsafe_code = "deny"

[workspace.lints.clippy]
# Numeric code is exactly where silent lossy casts hide. Make every
# narrowing conversion a deliberate, visible act.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
